global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'prod-infra-dev'
    environment: 'dev'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '10.0.2.245:9100'
          - '10.0.4.131:9100'
          - '10.0.2.253:9100'
          - '10.0.1.202:9100'
        labels:
          env: 'dev'

  # - job_name: 'app-servers'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets:
  #         - '10.0.2.245:3000'
  #         - '10.0.4.131:3000'
