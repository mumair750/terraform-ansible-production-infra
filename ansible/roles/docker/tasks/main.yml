---
- name: Remove conflicting docker packages
  apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - containerd
      - runc
    state: absent
    purge: yes
  ignore_errors: yes

- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker
    update_cache: yes

- name: Install Docker packages (without compose plugin)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
    state: present
  register: docker_install

- name: Install Docker Compose V2 (Ubuntu repo)
  apt:
    name: docker-compose-v2
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Verify Docker installation
  shell: docker --version && docker compose version
  register: docker_verify
  changed_when: false

- name: Show Docker version
  debug:
    msg: "{{ docker_verify.stdout_lines }}"
