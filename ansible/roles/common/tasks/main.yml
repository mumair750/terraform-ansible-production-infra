---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - apt-transport-https
      - software-properties-common
    state: present

- name: Set timezone to UTC
  timezone:
    name: UTC

- name: Create /opt directory for apps
  file:
    path: /opt
    state: directory
    mode: '0755'
